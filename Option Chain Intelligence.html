<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Option Chain Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: sticky dark navy bar, light research-terminal canvas of ruled sections, one dark decision slab, tabular data everywhere. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --surface2: #eceef3; --line: #dcdfe7; --line2: #c9cedb;
  --ink: #0d1a33; --ink2: #44506b; --muted: #738098;
  --navy: #0a1630; --navy2: #13244a; --navy-ink: #f2f4f9; --navy-mute: #9aa8c4; --navy-line: #263a66;
  --gold: #a87a1f; --gold-bright: #d4a73c; --gold-rgb: 184,134,43;
  --bull: #11795a; --bull-rgb: 17,121,90; --bear: #be3a2b; --bear-rgb: 190,58,43;
  --warn: #b56a00; --warn-rgb: 199,119,0; --info: #2557a7; --info-rgb: 37,87,167;
  --ce: #2557a7; --pe: #b0801f;
  --f-display: 'Newsreader', Georgia, 'Times New Roman', serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1222; --surface: #121b30; --surface2: #18233c; --line: #25324f; --line2: #34456a;
  --ink: #eaeef7; --ink2: #b4bfd6; --muted: #8493b0; --navy: #060d1d; --navy2: #101d3a; --navy-line: #263a66;
  --gold: #d4a73c; --bull: #3fbf93; --bull-rgb: 63,191,147; --bear: #ef7565; --bear-rgb: 239,117,101;
  --warn: #f0a23a; --warn-rgb: 240,162,58; --info: #6a9bea; --info-rgb: 106,155,234; --ce: #6a9bea; --pe: #d4a73c; --gold-rgb: 212,167,60;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1222; --surface: #121b30; --surface2: #18233c; --line: #25324f; --line2: #34456a;
  --ink: #eaeef7; --ink2: #b4bfd6; --muted: #8493b0; --navy: #060d1d; --navy2: #101d3a; --navy-line: #263a66;
  --gold: #d4a73c; --bull: #3fbf93; --bull-rgb: 63,191,147; --bear: #ef7565; --bear-rgb: 239,117,101;
  --warn: #f0a23a; --warn-rgb: 240,162,58; --info: #6a9bea; --info-rgb: 106,155,234; --ce: #6a9bea; --pe: #d4a73c; --gold-rgb: 212,167,60;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--info); }

/* header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--navy-ink); border-bottom: 1px solid var(--navy-line); }
.bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.mark { width: 30px; height: 30px; flex: none; }
.brand h1 { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.brand p { font-size: 12px; color: var(--navy-mute); }
.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--ink); padding: 7px 13px; border-radius: 4px; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--ink2); }
.btn.gold { background: var(--gold-bright); border-color: var(--gold-bright); color: #1b1503; font-weight: 600; }
.btn.gold:hover { background: #e2b64a; }
.btn.ghost { background: transparent; border-color: var(--navy-line); color: var(--navy-ink); }
.btn.ghost:hover { border-color: var(--navy-mute); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* page */
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: flex; flex-direction: column; gap: 18px; }
.wrap > * { min-width: 0; }
#out { width: 100%; }
.sec-h span { overflow-wrap: anywhere; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line2); padding-bottom: 6px; }
.sec-h h2 { font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); }
.sec-h span { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr; } .g2 { grid-template-columns: 1fr; } }
.lbl { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: .04em; border: 1px solid transparent; white-space: nowrap; }
.pill.bull { color: var(--bull); background: rgba(var(--bull-rgb), .12); border-color: rgba(var(--bull-rgb), .3); }
.pill.bear { color: var(--bear); background: rgba(var(--bear-rgb), .12); border-color: rgba(var(--bear-rgb), .3); }
.pill.warn { color: var(--warn); background: rgba(var(--warn-rgb), .13); border-color: rgba(var(--warn-rgb), .35); }
.pill.info { color: var(--info); background: rgba(var(--info-rgb), .11); border-color: rgba(var(--info-rgb), .3); }
.pill.gold { color: var(--gold); background: rgba(var(--gold-rgb), .13); border-color: rgba(var(--gold-rgb), .4); }
.pill.mute { color: var(--ink2); background: var(--surface2); border-color: var(--line); }
.up { color: var(--bull); } .dn { color: var(--bear); } .wn { color: var(--warn); } .mu { color: var(--muted); }

/* upload */
.upload { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; border-style: dashed; border-color: var(--line2); }
.upload.drag { border-color: var(--gold-bright); background: rgba(var(--gold-rgb), .06); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.steps b { color: var(--ink2); font-weight: 600; }
.steps i { font-style: normal; padding: 1px 7px; border: 1px solid var(--line); border-radius: 3px; }
.steps i.on { color: var(--ink); border-color: var(--gold-bright); background: rgba(var(--gold-rgb), .1); }
.fileinfo { margin-top: 8px; font-size: 12.5px; color: var(--ink2); }
.err { color: var(--bear); font-weight: 500; }
@media (max-width: 700px) { .upload { grid-template-columns: 1fr; } }
.pipe { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pipe li { display: flex; gap: 10px; align-items: center; color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
.pipe li.run { color: var(--ink); } .pipe li.done { color: var(--ink2); }
.pipe li::before { content: ''; width: 9px; height: 9px; border: 1.5px solid var(--line2); border-radius: 50%; flex: none; }
.pipe li.run::before { border-color: var(--gold-bright); background: var(--gold-bright); }
.pipe li.done::before { border-color: var(--bull); background: var(--bull); }

/* snapshot */
.snap { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.snap > div { background: var(--surface); padding: 11px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.snap .v { font-family: var(--f-mono); font-size: 19px; font-weight: 500; letter-spacing: -.01em; overflow-wrap: anywhere; }
.snap .s { font-size: 11.5px; color: var(--muted); }
@media (max-width: 980px) { .snap { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* decision slab (always dark) */
.slab { background: var(--navy); color: var(--navy-ink); border: 1px solid var(--navy-line); border-radius: 4px; overflow: hidden; }
.slab .ban { padding: 9px 18px; font-size: 11.5px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--navy-line); background: var(--navy2); }
.slab .ban.nt { color: #f0b55a; } .slab .ban.go { color: #67d6a8; } .slab .ban.wa { color: #f0b55a; }
.slab-body { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); }
@media (max-width: 860px) { .slab-body { grid-template-columns: 1fr; } }
.slab-l { padding: 20px 22px; border-right: 1px solid var(--navy-line); display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 860px) { .slab-l { border-right: 0; border-bottom: 1px solid var(--navy-line); } }
.act { font-family: var(--f-display); font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: -.01em; color: #fff; text-wrap: balance; }
.act.call { color: #67d6a8; } .act.put { color: #f08a7a; } .act.no { color: #f4c36a; }
.score { display: flex; align-items: baseline; gap: 8px; }
.score b { font-family: var(--f-mono); font-size: 30px; font-weight: 500; color: var(--gold-bright); }
.score span { font-size: 13px; color: var(--navy-mute); }
.meter { height: 6px; background: var(--navy-line); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold-bright); }
.slab small { color: var(--navy-mute); font-size: 11.5px; line-height: 1.45; }
.slab-r { padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px 16px; }
@media (max-width: 1100px) { .kv { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.kv > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv .k { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--navy-mute); font-weight: 600; }
.kv .v { font-family: var(--f-mono); font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.kv .v small { font-size: 11px; font-weight: 400; }
.kv .v.g { color: #67d6a8; } .kv .v.r { color: #f08a7a; }
.why { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: #dfe5f2; line-height: 1.5; }
.why li::marker { color: var(--gold-bright); }
.slab h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-bright); font-weight: 700; margin-bottom: 6px; }
.slab .stay { font-family: var(--f-display); font-size: 19px; color: #fff; }
.gate { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: #cdd6ea; }
.gate b { color: #f08a7a; font-weight: 600; } .gate b.ok { color: #67d6a8; }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 6px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface2); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.sel td { background: rgba(var(--gold-rgb), .12); }
tbody tr.clk { cursor: pointer; } tbody tr.clk:hover td { background: var(--surface2); }
td .sub { display: block; font-size: 10.5px; color: var(--muted); }
.bar-cell { display: inline-block; height: 6px; border-radius: 1px; vertical-align: middle; margin-left: 6px; }

/* heatmap */
.heat td, .heat th { padding: 4px 8px; font-family: var(--f-mono); font-size: 12px; }
.heat td.k { font-weight: 600; background: var(--surface2); text-align: center; position: sticky; left: 0; }
.heat tr.atm td.k { background: var(--navy); color: #fff; }
.heat tr.mk td.k { box-shadow: inset 3px 0 0 var(--gold-bright); }
.tags { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.tags i { font-style: normal; font-family: var(--f-body); font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 0 4px; border-radius: 2px; color: #fff; line-height: 15px; }
.tags .S { background: var(--bull); } .tags .R { background: var(--bear); } .tags .BC { background: var(--info); } .tags .BP { background: var(--gold); } .tags .A { background: var(--ink); } .tags .M { background: var(--muted); }

/* charts */
.chart { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chart h4 { font-size: 13px; font-weight: 600; }
.chart .cap { font-size: 11.5px; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }
svg text { font-family: var(--f-mono); fill: var(--muted); font-size: 10px; }
svg .ax { stroke: var(--line2); stroke-width: 1; } svg .gl { stroke: var(--line); stroke-width: 1; }

/* misc */
.zones { display: grid; gap: 8px; }
.zone { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.zone .st { font-family: var(--f-mono); font-weight: 600; font-size: 15px; }
.zone .d { font-size: 12px; color: var(--ink2); }
.zone .m { font-size: 11px; color: var(--muted); }
.sbar { width: 70px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; } .sbar i { display: block; height: 100%; }
.fac { display: grid; grid-template-columns: 130px minmax(0,1fr) 78px; gap: 10px; align-items: center; font-size: 12.5px; padding: 3px 0; }
.fac .t { height: 8px; background: var(--surface2); border-radius: 2px; overflow: hidden; } .fac .t i { display: block; height: 100%; background: var(--info); }
.fac .t i.na { background: repeating-linear-gradient(45deg, var(--line2), var(--line2) 3px, transparent 3px, transparent 6px); }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.callout { border-left: 3px solid var(--warn); background: rgba(var(--warn-rgb), .08); padding: 9px 12px; font-size: 12.5px; color: var(--ink2); border-radius: 0 4px 4px 0; }
.callout.info { border-left-color: var(--info); background: rgba(var(--info-rgb), .07); }
.callout.bad { border-left-color: var(--bear); background: rgba(var(--bear-rgb), .08); }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--ink2); }
.chk { display: grid; gap: 6px; font-size: 12.5px; }
.chk div { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 8px; align-items: start; }
details { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
details > summary { padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
details > div { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.cfg { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px 14px; }
@media (max-width: 900px) { .cfg { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.cfg label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--ink2); }
.cfg input { font: inherit; font-family: var(--f-mono); padding: 6px 8px; border: 1px solid var(--line2); border-radius: 3px; background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 4px; font-size: 13px; z-index: 40; max-width: calc(100% - 32px); border: 1px solid var(--navy-line); }
.foot { font-size: 12px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--line2); padding-top: 12px; }
@media (prefers-reduced-motion: no-preference) { .meter > i { transition: width .5s ease; } }
</style>

  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="3" fill="#13244a" stroke="#d4a73c" stroke-width="1.5"/><path d="M6 22 L12 15 L17 19 L26 8" fill="none" stroke="#d4a73c" stroke-width="2"/><circle cx="26" cy="8" r="2.2" fill="#d4a73c"/><path d="M6 26h20" stroke="#9aa8c4" stroke-width="1"/></svg>
    <div><h1>Option Chain Intelligence</h1><p>Professional Derivatives Decision Engine</p></div>

<script>(function(root){
'use strict';
/* =====================================================================
   OPTION CHAIN INTELLIGENCE ENGINE
   Modules (concatenated into one IIFE at build time):
     10 core / ingestion / column mapping / validation
     20 option maths (Black-Scholes, Greeks, parity) + analytics (OI, PCR, IV, max pain, S/R)
     30 signals (regime, breakout, scoring, candidates)
     40 risk plan + recommendation
     50 backtesting scaffold
   Nothing in here is specific to one file: every level, price and score is computed
   from whatever chain is passed in.
   ===================================================================== */
const OCI = { version: '1.0.0' };

/* ---------- configuration (all modular / overridable) ---------- */
OCI.DEFAULTS = {
  rate: 0.065,            // risk-free rate (annual) used for discounting / Greeks
  divYield: 0.013,        // dividend yield (annual) used for carry of the index
  nearSteps: 8,           // +/- strikes treated as "near ATM" for PCR / flow / ranks
  wallSteps: 14,          // +/- strikes searched for support / resistance walls
  candidateOffsets: [-2, -1, 0, 1, 2], // strikes from ATM evaluated per side
  weights: { structure: 15, oi: 15, volume: 10, pcr: 10, iv: 10, greeks: 10, liquidity: 10, momentum: 10, rr: 10 },
  dirWeights: { flow: 0.30, structure: 0.25, momentum: 0.25, pcr: 0.20 },
  wallWeights: { oi: 0.28, fresh: 0.18, prem: 0.14, vol: 0.12, prom: 0.10, prox: 0.18 },
  thresholds: { strong: 85, trade: 75, watch: 65, weak: 50 },
  minRR: 1.5,             // hard gate: reward/risk to the main target
  goodRR: 2.0,            // preferred reward/risk
  maxSpreadPct: 12,       // hard liquidity gate: bid-ask spread as % of mid
  deltaBand: [0.45, 0.70],// preferred |delta| for a directional long option
  minDelta: 0.20,         // soft gate (hard below 0.12)
  holdDays: 0.25,         // assumed time (calendar days) for the move to play out when repricing
  slBufferSteps: 0.5,     // stop buffer beyond a wall, in strike steps
  minStopEM: 0.20,        // stops tighter than this fraction of the expected move sit inside noise
  minTargetEM: 0.15,      // targets nearer than this fraction of the expected move are ignored
  maxTargetEM: 1.30,      // targets farther than this multiple of the expected move are unsupported
  strongWall: 60,         // wall strength above which targets beyond it need breakout confirmation
  momentumGain: 1.5,
  minOiChangePct: 0.01,   // noise filter for OI change classification
  minBias: 0.15,          // minimum direction-aligned bias for a full BUY
  conflictCap: 0.40,      // share of opposing signals above which BUY is capped to WATCH
  minBreakEM: 0.15,       // spot must clear a wall by this fraction of the expected move to count as a breakout
  minDQ: 50,              // minimum data quality (%) to allow any trade
  ivCrushPts: 5,          // vol points used in the IV-crush stress
  unstableEMpct: 1.5,     // expected move (% of spot, 1 sigma) above which the market is flagged unstable
  spotOverride: null, underlying: null, expiry: null, lotSize: null,
  riskCapital: null, riskPct: 1, lots: 1,
  asOf: null              // Date; defaults to now
};

/* ---------- utilities ---------- */
const U = {
  clamp: (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)),
  isNum: x => typeof x === 'number' && isFinite(x),
  nz: x => (typeof x === 'number' && isFinite(x)) ? x : 0,
  sum: a => a.reduce((s, x) => s + x, 0),
  mean: a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null,
  median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; },
  /* share of finite values in arr that are <= v  (cross-sectional rank, unit-free) */
  pctRank(arr, v) { const f = arr.filter(U.isNum); if (!f.length || !U.isNum(v)) return null; let c = 0; for (const x of f) if (x <= v) c++; return c / f.length; },
  max: a => a.reduce((m, x) => (U.isNum(x) && x > m) ? x : m, -Infinity),
  round: (x, d = 2) => U.isNum(x) ? Math.round(x * Math.pow(10, d)) / Math.pow(10, d) : null,
  merge(base, over) { const o = JSON.parse(JSON.stringify(base)); for (const k in (over || {})) { if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && !(over[k] instanceof Date)) o[k] = Object.assign({}, o[k] || {}, over[k]); else if (over[k] !== undefined) o[k] = over[k]; } return o; }
};
OCI.U = U;

/* =====================  DATA INGESTION  ===================== */
const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const head = text.split(/\r?\n/).slice(0, 6).join('\n');
  const cnt = { ',': (head.match(/,/g) || []).length, ';': (head.match(/;/g) || []).length, '\t': (head.match(/\t/g) || []).length };
  let delim = ','; if (cnt[';'] > cnt[','] && cnt[';'] > cnt['\t']) delim = ';'; else if (cnt['\t'] > cnt[',']) delim = '\t';
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; } else cell += ch; }
    else if (ch === '"') inQ = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => String(c).trim()));
}

/* number parser: Indian/Western separators, "-" and blanks are missing, (123) negative */
const NIL_RE = /^(-|--|—|–|na|n\/a|nan|null|none|nil|#n\/a)?$/i;
function isNil(v) { return v === null || v === undefined || (typeof v === 'string' && NIL_RE.test(v.trim())); }
function toNum(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim();
  if (NIL_RE.test(s)) return null;
  s = s.replace(/[,\s₹$]/g, '').replace(/%$/, '');
  if (/^\(.*\)$/.test(s)) s = '-' + s.slice(1, -1);
  const n = Number(s);
  return isFinite(n) ? n : null;
}

function parseExpiryString(s) {
  if (!s) return null;
  let m = String(s).match(/(\d{1,2})[-_ \/.]([A-Za-z]{3,9})[-_ \/.,]*(\d{2,4})/);
  if (m) { const mo = MONTHS[m[2].slice(0, 3).toLowerCase()]; if (mo !== undefined) { let y = +m[3]; if (y < 100) y += 2000; return { y, mo, d: +m[1] }; } }
  m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return { y: +m[1], mo: +m[2] - 1, d: +m[3] };
  m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return { y: +m[3], mo: +m[2] - 1, d: +m[1] };
  return null;
}
/* Indian index options expire at 15:30 IST = 10:00 UTC */
const expiryToDate = p => new Date(Date.UTC(p.y, p.mo, p.d, 10, 0, 0));

function guessUnderlying(name) {
  if (!name) return null;
  const up = String(name).toUpperCase();
  const m = up.match(/(?:^|[^A-Z0-9])(BANKNIFTY|FINNIFTY|MIDCPNIFTY|NIFTYNXT50|NIFTYBANK|NIFTY|SENSEX|BANKEX)(?:[^A-Z0-9]|$)/);
  if (m) return m[1] === 'NIFTYBANK' ? 'BANKNIFTY' : m[1];
  const dm = up.match(/([A-Z][A-Z0-9&]{1,})[-_ ]+\d{1,2}[-_ ][A-Z]{3}[-_ ]\d{2,4}/);
  if (dm && !/^(OPTION|CHAIN|ED|OC|DATA)$/.test(dm[1])) return dm[1];
  return null;
}

/* ---------- column mapping (name-variation tolerant, side from prefix or position) ---------- */
function normHeader(c) { return String(c == null ? '' : c).toLowerCase().replace(/[^a-z0-9%]+/g, ' ').trim(); }
function matchField(rem) {
  if (!rem) return null;
  if (/^strike( price| px)?$/.test(rem)) return 'strike';
  if (/\bbid\b.*\b(qty|quantity|size|q)\b|^bidq(ty)?$/.test(rem)) return 'bidQty';
  if (/\b(ask|offer)\b.*\b(qty|quantity|size|q)\b|^askq(ty)?$/.test(rem)) return 'askQty';
  if (/^(bid|bid price|best bid)$/.test(rem)) return 'bid';
  if (/^(ask|ask price|offer|best ask|best offer)$/.test(rem)) return 'ask';
  if (/(chng|chg|change)\b.*\boi\b|\boi\b.*(chng|chg|change)|^coi$|(chng|chg|change).*open interest|open interest.*(chng|chg|change)/.test(rem)) return 'chgOi';
  if (/^(oi|open interest|openinterest)$/.test(rem)) return 'oi';
  if (/^(volume|vol|volumes|traded volume|trade volume|contracts|no of contracts|number of contracts)$/.test(rem)) return 'volume';
  if (/^(iv|implied volatility|implied vol|iv %)$/.test(rem)) return 'iv';
  if (/^(ltp|last|last price|last traded price|lastprice|ltp price|close)$/.test(rem)) return 'ltp';
  if (/^(chng|chg|change|net change|net chng|price change|ltp chng|ltp chg|ltp change|change in ltp|chng in ltp|price chng)$/.test(rem)) return 'chg';
  if (/^(delta|gamma|theta|vega|rho)$/.test(rem)) return rem;
  return null;
}
const FIELD_LABEL = { oi: 'Open interest', chgOi: 'Change in OI', volume: 'Volume', iv: 'IV', ltp: 'LTP', chg: 'Price change', bidQty: 'Bid quantity', bid: 'Bid', ask: 'Ask', askQty: 'Ask quantity', delta: 'Delta', gamma: 'Gamma', theta: 'Theta', vega: 'Vega', rho: 'Rho' };
OCI.FIELD_LABEL = FIELD_LABEL;

function detectLayout(rows) {
  let hi = -1, strikeCol = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const c = rows[i].findIndex(x => /^strike( price| px)?$/.test(normHeader(x)));
    if (c >= 0) { hi = i; strikeCol = c; break; }
  }
  if (hi < 0) throw new Error('Could not find a STRIKE column in the first 40 rows. Check that the file is an option chain with a "Strike" header.');
  const header = rows[hi];
  const map = { CE: {}, PE: {} }, dup = [], ignored = [];
  header.forEach((cell, ci) => {
    if (ci === strikeCol) return;
    const n = normHeader(cell);
    if (!n || /^(no text|unnamed.*|column.*)$/.test(n)) return;
    let side = null;
    if (/\b(ce|calls?)\b/.test(n)) side = 'CE'; else if (/\b(pe|puts?)\b/.test(n)) side = 'PE';
    const rem = n.replace(/\b(ce|calls?|pe|puts?)\b/g, ' ').replace(/\s+/g, ' ').trim();
    const f = matchField(rem);
    if (!side) side = ci < strikeCol ? 'CE' : 'PE';
    if (!f || f === 'strike') { ignored.push(String(cell)); return; }
    if (map[side][f] !== undefined) { dup.push(`${side} ${f}`); return; }
    map[side][f] = ci;
  });
  return { headerRow: hi, strikeCol, map, duplicates: dup, ignored };
}

function scanMeta(rows, headerRow) {
  const meta = {};
  for (let i = 0; i < headerRow; i++) {
    const line = rows[i].join(' ');
    let m = line.match(/(underlying(?: value)?|spot(?: price)?|index(?: value)?|ltp of underlying)\D{0,15}?([\d,]+\.?\d*)/i);
    if (m && toNum(m[2]) > 100) meta.spot = toNum(m[2]);
    const ex = parseExpiryString(line); if (ex && /expir/i.test(line)) meta.expiry = ex;
    const un = guessUnderlying(line); if (un) meta.underlying = un;
  }
  return meta;
}

/* ---------- build strike records ---------- */
const LEG_FIELDS = ['oi', 'chgOi', 'volume', 'iv', 'ltp', 'chg', 'bidQty', 'bid', 'ask', 'askQty', 'delta', 'gamma', 'theta', 'vega', 'rho'];
const NIL_OK = ['oi', 'chgOi', 'volume'];   // "-" in these columns means nil (NSE convention); treated as 0 in totals

function buildStrikes(rows, layout) {
  const issues = [], out = [];
  let empty = 0, badStrike = 0;
  for (let i = layout.headerRow + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.every(c => c === '' || c == null)) { empty++; continue; }
    const K = toNum(r[layout.strikeCol]);
    if (K === null || K <= 0) { badStrike++; continue; }
    const rec = { strike: K, srcRow: i + 1, CE: {}, PE: {} };
    for (const side of ['CE', 'PE']) {
      const leg = rec[side]; leg.nil = {};
      for (const f of LEG_FIELDS) {
        const ci = layout.map[side][f];
        if (ci === undefined) { leg[f] = null; continue; }
        const raw = r[ci];
        leg[f] = toNum(raw);
        if (leg[f] === null && NIL_OK.includes(f)) leg.nil[f] = true;
      }
    }
    out.push(rec);
  }
  if (empty) issues.push({ level: 'info', code: 'empty_rows', count: empty, msg: `${empty} empty row(s) skipped` });
  if (badStrike) issues.push({ level: 'warn', code: 'bad_strike', count: badStrike, msg: `${badStrike} row(s) skipped because the strike was not a valid number` });
  return { strikes: out, issues };
}

/* ---------- validation & cleaning ---------- */
function validateAndClean(strikes, layout, issues) {
  // duplicates: merge, keeping the row with more populated fields
  const byK = new Map(); let dups = 0;
  const filled = s => ['CE', 'PE'].reduce((n, side) => n + LEG_FIELDS.filter(f => U.isNum(s[side][f])).length, 0);
  for (const s of strikes) {
    if (byK.has(s.strike)) { dups++; if (filled(s) > filled(byK.get(s.strike))) byK.set(s.strike, s); } else byK.set(s.strike, s);
  }
  if (dups) issues.push({ level: 'warn', code: 'duplicates', count: dups, msg: `${dups} duplicate strike row(s) merged (the more complete row was kept)` });
  let arr = [...byK.values()];
  const wasSorted = arr.every((s, i) => i === 0 || s.strike >= arr[i - 1].strike);
  arr.sort((a, b) => a.strike - b.strike);
  if (!wasSorted) issues.push({ level: 'info', code: 'unsorted', count: 1, msg: 'Strikes were not in ascending order and have been sorted' });

  let neg = 0, badPrice = 0, badIv = 0, crossed = 0, stale = 0, impossibleChg = 0;
  for (const s of arr) for (const side of ['CE', 'PE']) {
    const L = s[side];
    for (const f of ['oi', 'volume']) if (U.isNum(L[f]) && L[f] < 0) { L[f] = null; neg++; }
    for (const f of ['ltp', 'bid', 'ask']) if (U.isNum(L[f]) && L[f] <= 0) { L[f] = null; badPrice++; }
    if (U.isNum(L.iv) && (L.iv <= 0 || L.iv > 400)) { L.iv = null; badIv++; }
    if (U.isNum(L.bid) && U.isNum(L.ask) && L.bid > L.ask) { L.crossed = true; crossed++; }
    if (U.isNum(L.oi) && U.isNum(L.chgOi) && L.chgOi > L.oi) { impossibleChg++; }
    // quote metrics
    const qv = U.isNum(L.bid) && U.isNum(L.ask) && L.ask >= L.bid && !L.crossed;
    L.quoteValid = qv;
    L.mid = qv ? (L.bid + L.ask) / 2 : null;
    L.spread = qv ? L.ask - L.bid : null;
    L.spreadPct = qv && L.mid > 0 ? 100 * L.spread / L.mid : null;
    if (qv && U.isNum(L.ltp)) {
      const tol = Math.max(0.05, 0.02 * L.mid);
      L.ltpStale = L.ltp < L.bid - tol || L.ltp > L.ask + tol;
      if (L.ltpStale) stale++;
    } else L.ltpStale = false;
  }
  if (neg) issues.push({ level: 'warn', code: 'negative', count: neg, msg: `${neg} negative OI/volume value(s) ignored` });
  if (badPrice) issues.push({ level: 'warn', code: 'bad_price', count: badPrice, msg: `${badPrice} zero/negative price(s) ignored` });
  if (badIv) issues.push({ level: 'warn', code: 'bad_iv', count: badIv, msg: `${badIv} implausible IV value(s) ignored` });
  if (crossed) issues.push({ level: 'warn', code: 'crossed', count: crossed, msg: `${crossed} crossed quote(s) (bid > ask) ignored` });
  if (stale) issues.push({ level: 'info', code: 'stale_ltp', count: stale, msg: `${stale} LTP value(s) lie outside the current bid-ask; the quote mid is used instead` });
  if (impossibleChg) issues.push({ level: 'warn', code: 'chg_oi_gt_oi', count: impossibleChg, msg: `${impossibleChg} row(s) where the OI increase exceeds the OI itself (previous OI would be negative)` });

  // strike step
  const gaps = []; for (let i = 1; i < arr.length; i++) gaps.push(+(arr[i].strike - arr[i - 1].strike).toFixed(4));
  const freq = {}; gaps.forEach(g => freq[g] = (freq[g] || 0) + 1);
  const step = +Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0] || 50;
  const irregular = gaps.filter(g => Math.abs(g - step) > 1e-6).length;
  if (irregular) issues.push({ level: 'info', code: 'irregular_step', count: irregular, msg: `${irregular} strike gap(s) differ from the usual ${step} step` });

  // CE / PE mapping validation: call prices fall with strike, put prices rise
  const pairs = arr.filter(s => s.CE.mid != null && s.PE.mid != null);
  const corr = (xs, ys) => { const n = xs.length; if (n < 4) return null; const mx = U.mean(xs), my = U.mean(ys); let sxy = 0, sxx = 0, syy = 0; for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; } return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null; };
  const ks = pairs.map(s => s.strike);
  let cCE = corr(ks, pairs.map(s => s.CE.mid)), cPE = corr(ks, pairs.map(s => s.PE.mid));
  let swapped = false;
  if (cCE !== null && cPE !== null && cCE > 0.5 && cPE < -0.5) {
    for (const s of arr) { const t = s.CE; s.CE = s.PE; s.PE = t; }
    swapped = true; [cCE, cPE] = [cPE, cCE];
    issues.push({ level: 'warn', code: 'swapped', count: 1, msg: 'CALL and PUT columns appeared swapped (call prices rising with strike); they were swapped back automatically' });
  }
  // put-call parity linearity: (C-P) should fall ~1:1 with strike
  let parity = null;
  if (pairs.length >= 5) {
    const xs = pairs.map(s => s.strike), ys = pairs.map(s => s.CE.mid - s.PE.mid);
    const mx = U.mean(xs), my = U.mean(ys); let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < xs.length; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; }
    const slope = sxy / sxx; parity = { slope, r2: syy ? (sxy * sxy) / (sxx * syy) : null, n: pairs.length };
    if (Math.abs(slope + 1) > 0.15) issues.push({ level: 'warn', code: 'parity', count: 1, msg: `Put-call parity slope is ${slope.toFixed(2)} (expected about -1): CE/PE prices may be mis-mapped or stale` });
  }
  let monoViol = 0, monoN = 0;
  for (let i = 1; i < arr.length; i++) {
    const a = arr[i - 1], b = arr[i];
    if (a.CE.mid != null && b.CE.mid != null) { monoN++; if (b.CE.mid > a.CE.mid + Math.max(0.05, 0.02 * a.CE.mid)) monoViol++; }
    if (a.PE.mid != null && b.PE.mid != null) { monoN++; if (b.PE.mid < a.PE.mid - Math.max(0.05, 0.02 * a.PE.mid)) monoViol++; }
  }
  if (monoViol) issues.push({ level: 'warn', code: 'monotonic', count: monoViol, msg: `${monoViol} price(s) break the expected strike monotonicity (calls fall, puts rise)` });

  return { strikes: arr, step, parity, swapped, monoViol, monoN, stats: { dups, neg, badPrice, badIv, crossed, stale, impossibleChg } };
}

/* preliminary ATM (min |C-P|) used only to define the coverage window before spot is known */
function prelimATM(strikes) {
  let best = null;
  for (const s of strikes) if (s.CE.mid != null && s.PE.mid != null) { const d = Math.abs(s.CE.mid - s.PE.mid); if (best === null || d < best.d) best = { d, K: s.strike }; }
  return best ? best.K : (strikes.length ? strikes[Math.floor(strikes.length / 2)].strike : null);
}

/* ---------- data-quality score ---------- */
const DQ_WEIGHTS = { oi: .18, chgOi: .14, volume: .12, iv: .14, ltp: .12, bid: .10, ask: .10, bidQty: .05, askQty: .05 };
function dataQuality(strikes, layout, vres, cfg, atmK, step, issues) {
  const win = strikes.filter(s => Math.abs(s.strike - atmK) <= cfg.nearSteps * step + 1e-9);
  const legsN = win.length * 2;
  const cov = {}, available = [], missing = [], uncalc = [];
  for (const f of Object.keys(DQ_WEIGHTS)) {
    let have = 0;
    for (const s of win) for (const side of ['CE', 'PE']) {
      const L = s[side], colExists = layout.map[side][f] !== undefined;
      if (!colExists) continue;
      if (U.isNum(L[f]) || (NIL_OK.includes(f) && L.nil[f])) have++;
    }
    cov[f] = legsN ? have / legsN : 0;
    (cov[f] >= 0.5 ? available : missing).push(f);
  }
  const completeness = U.sum(Object.keys(DQ_WEIGHTS).map(f => DQ_WEIGHTS[f] * cov[f]));
  const st = vres.stats;
  const windowLegs = Math.max(1, legsN);
  const winStale = win.reduce((n, s) => n + ['CE', 'PE'].filter(sd => s[sd].ltpStale).length, 0);
  const winCrossed = win.reduce((n, s) => n + ['CE', 'PE'].filter(sd => s[sd].crossed).length, 0);
  const validity = U.clamp(1 - (winCrossed + 0.4 * winStale + 0.5 * vres.monoViol) / windowLegs);
  let structure = 1;
  if (st.dups) structure -= Math.min(0.2, st.dups * 0.02);
  if (!vres.parity) structure -= 0.15; else if (Math.abs(vres.parity.slope + 1) > 0.15) structure -= 0.3;
  if (strikes.length < 9) structure -= 0.3;
  structure = U.clamp(structure);
  const score = Math.round(100 * (0.60 * completeness + 0.28 * validity + 0.12 * structure));
  const label = score >= 90 ? 'Excellent' : score >= 80 ? 'Good' : score >= 65 ? 'Fair' : score >= 50 ? 'Poor' : 'Unusable';
  // metrics that cannot be calculated from this file
  const has = (f) => cov[f] >= 0.5;
  if (!has('iv')) uncalc.push('IV structure, Greeks (IV can be implied from price only where the quote is usable)');
  if (!has('chgOi')) uncalc.push('OI buildup / unwinding, fresh-writing analysis');
  if (!has('volume')) uncalc.push('Volume confirmation, Volume PCR');
  if (!has('bid') || !has('ask')) uncalc.push('Bid-ask spread and liquidity grading');
  uncalc.push('IV expansion / contraction and abnormal-volume detection (need historical snapshots)');
  uncalc.push('ATR (needs underlying price history)');
  return { score, label, completeness, validity, structure, coverage: cov, available, missing, uncalculable: uncalc, windowStrikes: win.length, issues };
}

OCI.ingest = { parseCSV, toNum, isNil, parseExpiryString, expiryToDate, guessUnderlying, detectLayout, scanMeta, buildStrikes, validateAndClean, prelimATM, dataQuality };
/* =====================  OPTION MATHS  =====================
   Black-Scholes-Merton with continuous dividend yield q:
     d1 = [ln(S/K) + (r - q + sigma^2/2) T] / (sigma sqrt T),  d2 = d1 - sigma sqrt T
     Call = S e^{-qT} N(d1) - K e^{-rT} N(d2)       Put = K e^{-rT} N(-d2) - S e^{-qT} N(-d1)
     Delta(call) = e^{-qT} N(d1)   Delta(put) = -e^{-qT} N(-d1)
     Gamma = e^{-qT} phi(d1) / (S sigma sqrt T)
     Vega  = S e^{-qT} phi(d1) sqrt T          (reported per 1 vol point)
     Theta = see code (reported per calendar day)
   ======================================================== */
const SQ2PI = Math.sqrt(2 * Math.PI);
const npdf = x => Math.exp(-0.5 * x * x) / SQ2PI;
function ncdf(x) {            // Abramowitz & Stegun 26.2.17 (abs error < 7.5e-8)
  const t = 1 / (1 + 0.2316419 * Math.abs(x)), d = npdf(x);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return x >= 0 ? 1 - p : p;
}
function bs(type, S, K, T, r, q, sig) {
  if (!(T > 0) || !(sig > 0)) {
    const intr = type === 'CE' ? Math.max(0, S - K) : Math.max(0, K - S);
    return { price: intr, delta: type === 'CE' ? (S > K ? 1 : 0) : (S < K ? -1 : 0), gamma: 0, theta: 0, vega: 0, rho: 0 };
  }

/* =====================  TIME TO EXPIRY  ===================== */

/* =====================  SYNTHETIC SPOT  =====================
   Put-call parity:  C - P = e^{-rT} (F - K)   =>   F = K + (C - P) e^{rT}

   Uses the strikes where |C-P| is smallest (closest to the forward) with tight two-sided quotes.      */

  const r = cfg.rate, q = cfg.divYield, T = tctx.known ? tctx.T : 0;
  const cand = [];

    const C = s.CE, P = s.PE;
    if (C.mid == null || P.mid == null || C.spreadPct > 20 || P.spreadPct > 20) continue;
    cand.push({ K: s.strike, F: s.strike + (C.mid - P.mid) * Math.exp(r * T), absd: Math.abs(C.mid - P.mid), w: 1 / (C.spread + P.spread + 0.05) });

/* Direction evidence: four independent signals in [-1, +1] (+ bullish), blended with configurable weights.

/* ---------- market regime ---------- */

function scoreFactors(side, L, K, plan, ctx) {

  const va = flow.volFlow != null ? (1 + dir * flow.volFlow) / 2 : null;

    good[1] ? { when: 'After T2', premium: good[0].premium, text: `Lift stop to Target 1 (₹${good[0].premium.toFixed(2)}, underlying ${good[0].underlying.toFixed(0)}) to lock the gain` } : null,
    { when: 'Beyond', premium: null, text: `Trail ${dir > 0 ? 'below' : 'above'} the most recent protective wall as new OI zones form; no fixed percentage is used` }
  ].filter(Boolean);
  return {
    ok: true, side, K, dir,
    entry: { preferredLow: L.bid, preferredHigh: L.mid, aggressive: L.ask, ref: entryRef, ltp: L.ltp, underlying: S },
    sl: { premium: slP, underlying: slLevel, basis: slBasis },
    targets: good, risk, rr: { t1: good[0].rr, t2: good[1] ? good[1].rr : null, t3: good[2] ? good[2].rr : null, main: main.rr, mainIs: good[1] ? 'T2' : 'T1', atAsk: rrAsk },
    avoidAbove: pMax, chaseLimit: chase, lotSize: lot, riskPerLot, lots: cfg.lots, lotsByRisk,
    maxLoss: riskPerLot ? riskPerLot * (lotsByRisk != null && cfg.riskCapital ? Math.max(lotsByRisk, 1) : cfg.lots) : null,
    trailing, holdDays: hold * 365,
    invalidation: `Underlying trades ${dir > 0 ? 'below' : 'above'} ${slLevel.toFixed(0)} (${slBasis}). Exit on that level, not on a premium percentage.`,
    assumptions: `Premiums re-priced at the target/stop underlying levels with IV unchanged and ${(hold * 365).toFixed(2)} day(s) elapsed.`
  };
}
OCI.planTrade = planTrade;

/* =====================  RECOMMENDATION ENGINE  ===================== */
const inr = x => x == null ? '–' : '₹' + Number(x).toFixed(2);
const nIN = x => x == null ? '–' : Number(x).toLocaleString('en-IN');
const zlab = z => z.low === z.high ? `${z.peak}` : `${z.low}-${z.high}`;
const sgn = x => (x > 0 ? '+' : '') + nIN(x);

function describeFlow(z, noun) {
  if (!z) return null;
  const f = z.flow ? z.flow.label.toLowerCase() : null;
  const parts = [`${noun} ${zlab(z)} (strength ${z.strength}, ${z.grade.toLowerCase()})`];
  if (U.isNum(z.chgOi)) parts.push(`OI ${sgn(z.chgOi)}`);
  if (U.isNum(z.chg)) parts.push(`premium ${z.chg > 0 ? '+' : ''}${z.chg}`);
  if (f) parts.push(f);
  return parts.join(', ');
}

function explainTrade(c, ctx) {
  const { S, sr, pcr, mom, volume, iv, regime, dirE } = ctx, dir = c.dir, L = c.leg, p = c.plan, out = [];
  const own = dir > 0 ? sr.support[0] : sr.resistance[0], opp = dir > 0 ? sr.resistance[0] : sr.support[0];
  let s1 = `Spot is about ${Math.round(S)} (${ctx.spotSource.toLowerCase()}).`;
  if (own) s1 += ` Protective ${dir > 0 ? 'support' : 'resistance'} ${zlab(own)} is ${Math.round(Math.abs(own.peak - S))} points away`;
  if (opp) s1 += `${own ? ' and' : ''} the nearest ${dir > 0 ? 'resistance' : 'support'} ${zlab(opp)} is ${Math.round(Math.abs(opp.peak - S))} points away.`; else if (own) s1 += '.';
  out.push(s1);
  const a = describeFlow(own, dir > 0 ? 'Put side' : 'Call side'), b = describeFlow(opp, dir > 0 ? 'Call side' : 'Put side');
  if (a || b) out.push(`OI behaviour: ${[a, b].filter(Boolean).join('; ')}.`);
  if (volume.volFlow != null) out.push(`${volume.label}: volume-weighted OI flow is ${volume.volFlow > 0 ? 'bullish' : 'bearish'} (${volume.volFlow.toFixed(2)}); this strike traded ${nIN(L.volume)} contracts.`);
  const pm = [];
  if (pcr.oiNear != null) pm.push(`near-ATM OI PCR ${pcr.oiNear.toFixed(2)} (full chain ${pcr.oiAll != null ? pcr.oiAll.toFixed(2) : 'n/a'})`);
  if (mom.points != null) pm.push(`premiums imply the underlying is ${mom.points >= 0 ? 'up' : 'down'} about ${Math.abs(mom.points).toFixed(0)} points since the previous close`);
  if (pm.length) out.push(`Positioning and momentum: ${pm.join('; ')}.`);
  const ob = [`|Delta| ${L.delta != null ? Math.abs(L.delta).toFixed(2) : 'n/a'}`, `spread ${L.spreadPct != null ? L.spreadPct.toFixed(2) + '%' : 'n/a'}`];
  if (L.ivUsed != null && iv.atmIv) ob.push(`IV ${(L.ivUsed * 100).toFixed(1)}% vs ATM ${(iv.atmIv * 100).toFixed(1)}%`);
  if (L.thetaBurn != null) ob.push(`theta burn ${(L.thetaBurn * 100).toFixed(0)}% of premium per day`);
  out.push(`${c.K} ${c.side} (${c.label}) ranks highest on the risk-adjusted comparison: ${ob.join(', ')}.`);
  if (p && p.ok) out.push(`Risk is defined before entry: stop ${inr(p.sl.premium)} (${p.sl.basis}); Target 1 ${inr(p.targets[0].premium)}${p.targets[1] ? ', Target 2 ' + inr(p.targets[1].premium) : ''}; R:R 1 : ${p.rr.main.toFixed(2)} to ${p.rr.mainIs}.`);
  if (c.softFails.length) out.push('Cautions: ' + c.softFails.map(g => g.msg).join('; ') + '.');
  return out;
}

function explainNoTrade(ref, ctx, cands) {
  const { regime, dirE, sr, cfg, dq, S, EM } = ctx, r = [];
  if (/INSUFFICIENT/.test(regime.regime)) r.push(`Missing critical data: ${regime.why.join('; ')}.`);
  if (/RANGE/.test(regime.regime)) r.push(`Range-bound market: ${regime.why.join('; ')}.`);
  if (/UNSTABLE/.test(regime.regime)) r.push(`High-volatility / unstable conditions: ${regime.why.join('; ')}.`);
  if (dirE.conflict >= cfg.conflictCap) r.push(`Conflicting evidence: ${dirE.oppose} of ${dirE.agree + dirE.oppose} directional signals oppose the lead signal (${Object.entries(dirE.signals).filter(e => e[1] != null).map(e => `${e[0]} ${e[1].toFixed(2)}`).join(', ')}).`);
  const rrs = ['CE', 'PE'].map(sd => cands[sd][0]).filter(c => c && c.plan && c.plan.ok).map(c => `${c.K} ${c.side} 1 : ${c.plan.rr.main.toFixed(2)}`);
  if (rrs.length && ref && ref.plan && ref.plan.ok && ref.plan.rr.main < cfg.minRR) r.push(`Poor risk/reward: best setups offer ${rrs.join(' and ')} against a minimum of 1 : ${cfg.minRR}.`);
  for (const sd of ['CE', 'PE']) { const c = cands[sd][0]; if (c && c.plan && !c.plan.ok) r.push(`${c.K} ${c.side}: ${c.plan.reason}.`); }
  if (ctx.bk.up.state !== 'confirmed' && ctx.bk.down.state !== 'confirmed') r.push('No breakout confirmation in either direction.');
  if (ctx.volume.label.startsWith('Weak')) r.push('Weak volume confirmation of the direction implied by OI flow.');
  if (ref && ref.hardFails.length) r.push(`Highest-ranked setup (${ref.K} ${ref.side}, ${ref.score}/100) fails: ${ref.hardFails.map(g => g.msg).join('; ')}.`);
  else if (ref) r.push(`Highest Signal Quality is ${ref.score}/100 (${ref.signal.toLowerCase()}), below the ${cfg.thresholds.watch} needed even for a watch-list entry.`);
  if (dq.score < cfg.minDQ) r.push(`Data quality ${dq.score}% is below the ${cfg.minDQ}% minimum.`);
  return r;
}

function triggersFor(ctx) {
  const { sr, bk } = ctx, t = [], zl2 = zlab;
  const r1 = sr.resistance[0], s1 = sr.support[0];
  if (r1) t.push(`Bullish: spot holding above ${r1.high} with Call OI at ${r1.peak} unwinding (now ${U.isNum(r1.chgOi) ? sgn(r1.chgOi) : 'n/a'}) and CE volume expanding.`);
  if (s1) t.push(`Bearish: spot holding below ${s1.low} with Put OI at ${s1.peak} unwinding (now ${U.isNum(s1.chgOi) ? sgn(s1.chgOi) : 'n/a'}) and PE volume expanding.`);
  t.push('Re-upload a fresh option chain after a decisive move; a second snapshot also enables IV and OI trend checks.');
  return t;
}

function decide(ctx, cands) {
  const { cfg } = ctx, thr = cfg.thresholds;
  const all = [...cands.CE, ...cands.PE].filter(c => c.exists).sort((a, b) => b.score - a.score);
  const passing = all.filter(c => c.hardFails.length === 0);
  const top = passing[0] || null, ref = top || all[0] || null;
  let action = 'NO TRADE', cls = 'NO TRADE', chosen = null;
  if (top) {
    const sc = top.score;
    if (sc >= thr.trade) action = top.softFails.length ? 'WATCH' : 'BUY';
    else if (sc >= thr.watch) action = 'WATCH';
    if (action !== 'NO TRADE') { chosen = top; cls = top.softFails.length && sc >= thr.trade ? 'WATCH' : top.signal; }
  }
  const label = action === 'NO TRADE' ? 'NO TRADE' : `${action} ${chosen.side === 'CE' ? 'CALL' : 'PUT'}`;
  let alt = null;
  if (chosen) alt = passing.find(c => c !== chosen && c.score >= thr.weak && !(c.side === chosen.side && c.K === chosen.K)) || null;
  return {
    action: label, kind: action, classification: cls, chosen, reference: ref, alternative: alt,
    score: chosen ? chosen.score : (ref ? ref.score : null),
    reasons: chosen ? explainTrade(chosen, ctx) : [],
    noTradeReasons: action === 'NO TRADE' ? explainNoTrade(ref, ctx, cands) : [],
    triggers: triggersFor(ctx),
    banner: action === 'NO TRADE' ? 'NO TRADE — WAIT FOR CONFIRMATION' : action === 'WATCH' ? 'WATCH — SETUP NOT YET CONFIRMED' : 'ACTIONABLE SETUP',
    staying: action === 'NO TRADE' ? 'Staying out is currently the highest-quality decision.' : null,
    referenceReasons: (action === 'NO TRADE' && ref) ? [] : []
  };
}

/* =====================  PIPELINE  ===================== */
function detectLot(strikes, atmK, step) {
  const q = []; for (const s of strikes) if (Math.abs(s.strike - atmK) <= 10 * step) for (const sd of ['CE', 'PE']) { [s[sd].bidQty, s[sd].askQty].forEach(v => { if (U.isNum(v) && v > 0 && Number.isInteger(v)) q.push(v); }); }
  if (q.length < 6) return null;
  const g = (a, b) => b ? g(b, a % b) : a;
  const lot = q.reduce((a, b) => g(a, b));
  return lot >= 5 && lot <= 2000 ? lot : null;
}

function makeSteps(rows, userOpts, st) {
  const cfg = U.merge(OCI.DEFAULTS, userOpts || {});
  st.cfg = cfg;
  return [
    ['Reading option chain...', () => {
      st.layout = OCI.ingest.detectLayout(rows);
      st.meta = OCI.ingest.scanMeta(rows, st.layout.headerRow);
      const b = OCI.ingest.buildStrikes(rows, st.layout);
      st.raw = b.strikes; st.issues = b.issues;
      if (b.strikes.length < 5) throw new Error('Fewer than 5 valid strike rows were found; this does not look like a usable option chain.');
    }],
    ['Validating market data...', () => {
      st.v = OCI.ingest.validateAndClean(st.raw, st.layout, st.issues);
      st.strikes = st.v.strikes; st.step = st.v.step;
      st.prelim = OCI.ingest.prelimATM(st.strikes);
      st.dq = OCI.ingest.dataQuality(st.strikes, st.layout, st.v, cfg, st.prelim, st.step, st.issues);
      if (st.layout.duplicates.length) st.issues.push({ level: 'info', code: 'dup_cols', count: st.layout.duplicates.length, msg: 'Duplicate column(s) ignored: ' + st.layout.duplicates.join(', ') });
    }],
    ['Calculating OI structure...', () => {
      const A = OCI.analytics, strikes = st.strikes;
      // identity: file name > metadata > user input
      const exParts = cfg.expiry ? OCI.ingest.parseExpiryString(cfg.expiry) : (st.meta.expiry || OCI.ingest.parseExpiryString(userOpts && userOpts.filename));
      st.underlying = cfg.underlying || st.meta.underlying || OCI.ingest.guessUnderlying(userOpts && userOpts.filename) || 'UNKNOWN';
      st.asOf = cfg.asOf ? new Date(cfg.asOf) : new Date();
      st.tctx = A.timeContext(exParts, st.asOf);
      // spot
      const est = A.estimateSpot(strikes, st.tctx, cfg);
      st.spotEst = est;
      if (cfg.spotOverride > 0) { st.S = +cfg.spotOverride; st.spotSource = 'Actual (entered by user)'; st.spotActual = true; }
      else if (st.meta.spot > 0) { st.S = st.meta.spot; st.spotSource = 'Actual (read from file)'; st.spotActual = true; }
      else if (est) { st.S = est.spot; st.spotSource = 'Estimated Synthetic Spot (put-call parity)'; st.spotActual = false; }
      else throw new Error('Spot price could not be determined: the file has no spot and too few strikes with two-sided quotes on both CE and PE for a parity estimate. Enter the spot manually in Model settings.');
      // ATM
      let atm = strikes[0].strike; for (const s of strikes) if (Math.abs(s.strike - st.S) < Math.abs(atm - st.S) - 1e-9) atm = s.strike;
      st.atmK = atm;
      st.lotSize = cfg.lotSize || detectLot(strikes, atm, st.step);
      st.dq = OCI.ingest.dataQuality(strikes, st.layout, st.v, cfg, atm, st.step, st.issues);
      const base = { S: st.S, atmK: atm, step: st.step, cfg, tctx: st.tctx, spotActual: st.spotActual };
      A.enrichLegs(strikes, base);
      st.win = A.nearWindow(strikes, atm, st.step, cfg.nearSteps);
      st.iv = A.ivEngine(strikes, st.win, base);
      if (st.iv.mismatchCount) st.issues.push({ level: 'info', code: 'iv_mismatch', count: st.iv.mismatchCount, msg: `${st.iv.mismatchCount} near-ATM IV value(s) differ by more than 6 vol points from the IV implied by the quoted price (file IV is used)` });
      st.dq.notes = [];
      if (st.lotSize) st.dq.notes.push(`Lot size inferred from bid/ask quantities: ${st.lotSize}`);
      st.dq.notes.push('"-" in OI, change-in-OI and volume columns is treated as nil (NSE convention); "-" in price, IV and Greek columns is treated as missing');
      // expected move (1 sigma over remaining life) with straddle cross-check
      const atmRec = strikes.find(s => s.strike === atm);
      const straddle = (atmRec.CE.mid != null && atmRec.PE.mid != null) ? atmRec.CE.mid + atmRec.PE.mid : null;
      let EM = null, emSource = null;
      if (st.iv.atmIv && st.tctx.known) { EM = st.S * st.iv.atmIv * Math.sqrt(st.tctx.T); emSource = 'ATM IV x sqrt(time)'; }
      else if (straddle) { EM = 1.25 * straddle; emSource = 'ATM straddle x 1.25'; }
      else { EM = 4 * st.step; emSource = 'fallback (4 strike steps): IV, expiry and straddle unavailable'; }
      st.EM = EM; st.emSource = emSource; st.straddle = straddle;
      st.ctx = Object.assign({}, base, { EM, win: st.win, lotSize: st.lotSize, spotSource: st.spotSource, iv: st.iv, dq: st.dq, strikes });
      st.maxPain = A.maxPain(strikes);
      st.pcr = A.pcrEngine(strikes, st.win, cfg);
      st.sr = A.srEngine(strikes, st.ctx);
      st.flow = A.flowEngine(strikes, st.win, st.ctx);
      st.mom = A.momentumEngine(strikes, st.win, st.ctx);
      st.dirE = OCI.signals.directionEngine(st.ctx, st.flow, st.pcr, st.sr, st.mom);
      st.ctx.D = st.dirE.D;
      st.volume = A.volumeEngine(strikes, st.win, st.ctx, st.flow);
      Object.assign(st.ctx, { sr: st.sr, pcr: st.pcr, flow: st.flow, mom: st.mom, dirE: st.dirE, volume: st.volume });
    }],
    ['Analysing volatility...', () => {
      st.bk = OCI.signals.breakoutEngine(st.ctx, st.sr, st.strikes, st.win);
      st.regime = OCI.signals.regimeEngine(st.ctx, st.dirE, st.iv, st.sr, st.bk, st.dq, st.win);
      Object.assign(st.ctx, { bk: st.bk, regime: st.regime });
    }],
    ['Ranking trade setups...', () => { st.cands = OCI.signals.buildCandidates(st.ctx, st.strikes); }],
    ['Calculating risk/reward...', () => {
      for (const sd of ['CE', 'PE']) for (const c of st.cands[sd]) if (c.plan && c.plan.ok) c.plan.maxLossText = c.plan.riskPerLot ? `₹${Math.round(c.plan.riskPerLot * (c.plan.lots || 1)).toLocaleString('en-IN')} for ${c.plan.lots || 1} lot(s) of ${c.plan.lotSize}` : 'lot size not detected';
    }],
    ['Generating final decision...', () => {
      st.decision = decide(st.ctx, st.cands);
      // breakout checks that need candidates (liquidity & R:R)
      for (const k of ['up', 'down']) {
        const bkk = st.bk[k], best = st.cands[bkk.dir > 0 ? 'CE' : 'PE'][0];
        if (best) { bkk.checks.push({ id: 'liq', name: 'Liquidity', pass: best.leg.spreadPct != null ? best.leg.spreadPct <= cfg.maxSpreadPct : null, detail: best.leg.spreadPct != null ? `${best.K} spread ${best.leg.spreadPct.toFixed(2)}%` : 'n/a' });
          bkk.checks.push({ id: 'rr', name: 'Risk / reward', pass: best.plan && best.plan.ok ? best.plan.rr.main >= cfg.minRR : false, detail: best.plan && best.plan.ok ? `1 : ${best.plan.rr.main.toFixed(2)}` : (best.plan ? best.plan.reason : 'n/a') }); }
      }
    }]
  ];
}
function assemble(st) {
  return {
    version: OCI.version, generatedAt: st.asOf, cfg: st.cfg, filename: (st.cfg && st.cfg.filename) || null,
    underlying: st.underlying, spot: st.S, spotSource: st.spotSource, spotActual: st.spotActual, spotEst: st.spotEst,
    expiry: st.tctx.known ? st.tctx.expiry : null, tctx: st.tctx, dte: st.tctx.known ? st.tctx.dte : null,
    atm: st.atmK, step: st.step, lotSize: st.lotSize, expectedMove: st.EM, emSource: st.emSource, straddle: st.straddle,
    dataQuality: st.dq, layout: st.layout, strikes: st.strikes, maxPain: st.maxPain, pcr: st.pcr, iv: st.iv, flow: st.flow, momentum: st.mom,
    volume: st.volume, sr: st.sr, direction: st.dirE, regime: st.regime, breakout: st.bk, candidates: st.cands, decision: st.decision, parity: st.v.parity
  };
}
OCI.analyze = function (rows, opts, onStage) {
  const st = {}, steps = makeSteps(rows, opts, st);
  steps.forEach(([label, fn], i) => { if (onStage) onStage(i, label, steps.length); fn(); });
  return assemble(st);
};
OCI.analyzeAsync = async function (rows, opts, onStage) {
  const st = {}, steps = makeSteps(rows, opts, st), wait = ms => new Promise(r => setTimeout(r, ms));
  for (let i = 0; i < steps.length; i++) { if (onStage) onStage(i, steps[i][0], steps.length); await wait(140); steps[i][1](); }
  return assemble(st);
};
OCI.analyzeText = (text, filename, opts) => OCI.analyze(OCI.ingest.parseCSV(text), Object.assign({ filename }, opts || {}));
OCI.STAGES = ['Reading option chain...', 'Validating market data...', 'Calculating OI structure...', 'Analysing volatility...', 'Ranking trade setups...', 'Calculating risk/reward...', 'Generating final decision...'];
OCI.fmt = { inr, nIN, sgn, zlab };

/* =====================  BACKTESTING SCAFFOLD  =====================
   Intended flow:  historical snapshots -> signal generation -> subsequent price movement -> trade outcome -> statistics.
   snapshot(result)            compact, serialisable record of the signal (store one per uploaded file)
   evaluate(signal, nextResult) replays the signal against a LATER snapshot of the same expiry and returns an R-multiple
   stats(outcomes)             win rate, avg win/loss, profit factor, expectancy, max drawdown, avg R:R, false-signal rate,
                               score-vs-outcome buckets, performance by regime
   No accuracy claim is made until this has been run over a real, sufficiently large history.                      */
OCI.backtest = {
  snapshot(res) {
    const d = res.decision, c = d.chosen;
    return { t: res.generatedAt, underlying: res.underlying, expiry: res.expiry, spot: res.spot, regime: res.regime.regime,
      action: d.action, score: d.score, side: c ? c.side : null, strike: c ? c.K : null, entry: c && c.plan.ok ? c.plan.entry.ref : null,
      sl: c && c.plan.ok ? c.plan.sl.premium : null, slU: c && c.plan.ok ? c.plan.sl.underlying : null,
      targets: c && c.plan.ok ? c.plan.targets.map(t => ({ p: t.premium, u: t.underlying })) : [], rr: c && c.plan.ok ? c.plan.rr.main : null };
  },
  evaluate(sig, next) {
    if (!sig.side) return null;
    const rec = next.strikes.find(s => s.strike === sig.strike); if (!rec) return null;
    const L = rec[sig.side], px = L.px ?? L.mid; if (px == null) return null;
    const risk = sig.entry - sig.sl, pnl = px - sig.entry;
    const hitSL = (sig.side === 'CE' ? next.spot <= sig.slU : next.spot >= sig.slU) || px <= sig.sl;
    const hitT = sig.targets.filter(t => px >= t.p).length;
    return { score: sig.score, regime: sig.regime, rr: sig.rr, r: risk > 0 ? Math.max(-1, pnl / risk) : null, hitSL, targetsHit: hitT, pnl };
  },
  stats(outcomes) {
    const o = outcomes.filter(x => x && x.r != null); if (!o.length) return null;
    const wins = o.filter(x => x.r > 0), loss = o.filter(x => x.r <= 0);
    const gw = U.sum(wins.map(x => x.r)), gl = Math.abs(U.sum(loss.map(x => x.r)));
    let eq = 0, peak = 0, dd = 0; o.forEach(x => { eq += x.r; peak = Math.max(peak, eq); dd = Math.max(dd, peak - eq); });
    const bucket = (lo, hi) => { const b = o.filter(x => x.score >= lo && x.score < hi); return { range: `${lo}-${hi - 1}`, n: b.length, avgR: b.length ? U.mean(b.map(x => x.r)) : null }; };
    const regimes = {}; o.forEach(x => { (regimes[x.regime] = regimes[x.regime] || []).push(x.r); });
    return { n: o.length, winRate: wins.length / o.length, avgWin: wins.length ? gw / wins.length : null, avgLoss: loss.length ? -gl / loss.length : null,
      profitFactor: gl > 0 ? gw / gl : null, expectancy: U.mean(o.map(x => x.r)), maxDrawdownR: dd, avgRR: U.mean(o.filter(x => x.rr != null).map(x => x.rr)),
      falseSignalRate: o.filter(x => x.hitSL && x.targetsHit === 0).length / o.length,
      byScore: [bucket(0, 65), bucket(65, 75), bucket(75, 85), bucket(85, 101)],
      byRegime: Object.fromEntries(Object.entries(regimes).map(([k, v]) => [k, { n: v.length, avgR: U.mean(v) }])) };
  }
};
if (typeof module !== 'undefined' && module.exports) module.exports = OCI;
root.OCI = OCI;

<script>(function () {

function rowsFromWorkbook(buf) {
  if (typeof XLSX === 'undefined') throw new Error('The spreadsheet reader could not be loaded. Save the sheet as CSV and upload that instead.');
