  else {
    const now = new Date();
    if (ex && OCI.ingest.expiryToDate(ex) <= now) { o.asOf = new Date(Date.UTC(ex.y, ex.mo, ex.d - 1, 9, 42)); o.assumed = 'The expiry in this file has already passed, so the snapshot time is assumed to be 15:12 IST on the previous session (' + dstr(o.asOf) + '). Set the real time in Model settings if it differs.'; }
  }
  return o;
}

/* ---------- run ---------- */
async function runAnalysis() {
  if (!S.rows) return;
  const list = $('pipeList'); $('pipe').hidden = false; $('out').style.opacity = .35; setStep(3);
  list.innerHTML = OCI.STAGES.map((s, i) => `<li id="st${i}">${s}</li>`).join('');
  try {
    const o = buildOpts(), assumed = o.assumed; delete o.assumed;
    const res = await OCI.analyzeAsync(S.rows, o, (i) => { for (let j = 0; j < OCI.STAGES.length; j++) { const li = $('st' + j); li.className = j < i ? 'done' : j === i ? 'run' : ''; } });
    for (let j = 0; j < OCI.STAGES.length; j++) $('st' + j).className = 'done';
    res.asOfAssumed = assumed; res.asOfDate = o.asOf || new Date(); S.res = res;
    const best = res.decision.chosen || res.decision.reference; S.sel = best ? best.side + best.K : null;
    await new Promise(r => setTimeout(r, 250));
    $('pipe').hidden = true; $('out').style.opacity = 1; setStep(4); render(); $('btnReport').disabled = false;
  } catch (e) {
    $('pipe').hidden = true; $('out').style.opacity = 1; setStep(2);
    $('out').innerHTML = `<div class="callout bad"><b>Analysis could not be completed.</b><br>${esc(e.message)}</div>`; console.error(e);
  }
}

/* ---------- chart primitives (one scale per chart, theme tokens only) ---------- */
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; }
function chart(o) {
  const { strikes, series, kind = 'bar', h = 230, fmt = compact, markers = [], step, title, cap, id, bands = [] } = o;
  const W = 900, L = 52, R = 12, T = 12, B = 30, iw = W - L - R, ih = h - T - B, n = strikes.length;
  const all = series.flatMap(s => s.vals).filter(U.isNum);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if (kind === 'line') { lo = Math.min(...all); hi = Math.max(...all); const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad; if (o.zero) lo = Math.min(lo, 0); }
  else { hi = niceMax(hi); if (lo < 0) lo = -niceMax(-lo); }
  const y = v => T + ih * (1 - (v - lo) / (hi - lo)), slot = iw / n, x = i => L + slot * (i + .5);
  const xi = K => (K - strikes[0]) / step; // fractional index
  let g = '';
  for (let t = 0; t <= 4; t++) { const v = lo + (hi - lo) * t / 4, yy = y(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${fmt(v)}</text>`; }
  if (lo < 0 && hi > 0) g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  for (const b of bands) { const x1 = L + slot * (xi(b.lo) ), x2 = L + slot * (xi(b.hi) + 1); g += `<rect x="${Math.max(L, x1)}" y="${T}" width="${Math.max(2, Math.min(W - R, x2) - Math.max(L, x1))}" height="${ih}" fill="${b.color}" opacity=".13"/>`; }
  const every = Math.ceil(n / 12);
  strikes.forEach((K, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${h - 10}" text-anchor="middle">${nIN(K)}</text>`; });
  if (kind === 'bar') {
    const bw = Math.max(2, Math.min(18, slot * (series.length > 1 ? .4 : .7)));
    series.forEach((s, si) => s.vals.forEach((v, i) => { if (!U.isNum(v)) return; const cx = x(i) + (si - (series.length - 1) / 2) * (bw + 1), y0 = y(0), y1 = y(v); g += `<rect x="${cx - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(.5, Math.abs(y1 - y0))}" fill="${s.color}"><title>${nIN(strikes[i])} ${s.name}: ${nIN(v)}</title></rect>`; }));
  } else series.forEach(s => {
    let d = '', pen = false; s.vals.forEach((v, i) => { if (!U.isNum(v)) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    s.vals.forEach((v, i) => { if (U.isNum(v)) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.2" fill="${s.color}"><title>${nIN(strikes[i])} ${s.name}: ${f2(v, 2)}</title></circle>`; });
  });
  for (const m of markers) { if (m.K < strikes[0] - step / 2 || m.K > strikes[n - 1] + step / 2) continue; const xx = L + slot * (xi(m.K) + .5); g += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T + ih}" stroke="${m.color}" stroke-width="1.4" stroke-dasharray="${m.dash || '4 3'}"/><text x="${xx + 3}" y="${T + 9 + (m.row || 0) * 11}" style="fill:${m.color};font-weight:600">${m.label}</text>`; }
  return `<div class="chart"><h4>${title}</h4>${cap ? `<div class="cap">${cap}</div>` : ''}<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}">${g}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}${markers.map(m => `<span><i style="background:${m.color};height:2px;vertical-align:3px"></i>${m.label}</span>`).join('')}</div></div>`;
}

/* ---------- section renderers ---------- */
const cls = x => x > 0 ? 'up' : x < 0 ? 'dn' : '';
function secH(t, s) { return `<div class="sec-h"><h2>${t}</h2>${s ? `<span>${s}</span>` : ''}</div>`; }
function regPill(r) { const x = r.regime; const c = /BULL/.test(x) ? 'bull' : /BEAR/.test(x) ? 'bear' : /UNSTABLE/.test(x) ? 'warn' : /INSUFF/.test(x) ? 'mute' : 'info'; return `<span class="pill ${c}">${x}</span>`; }
function biasPill(b) { return `<span class="pill ${b === 'Bullish' ? 'bull' : b === 'Bearish' ? 'bear' : 'info'}">${b}</span>`; }
function sigPill(s) { const c = s === 'STRONG TRADE' || s === 'TRADE' ? 'bull' : s === 'WATCH' ? 'warn' : s === 'WEAK' ? 'mute' : 'bear'; return `<span class="pill ${c}">${s}</span>`; }

function rDQ(r) {
  const d = r.dataQuality, c = d.score >= 80 ? 'bull' : d.score >= 65 ? 'info' : d.score >= 50 ? 'warn' : 'bear', L = OCI.FIELD_LABEL, hdr = S.rows[r.layout.headerRow];
  const mapRow = side => Object.entries(r.layout.map[side]).map(([f, ci]) => `<tr><td class="l">${esc(L[f] || f)}</td><td class="l">${esc(hdr[ci] || '')}</td><td>${pct(d.coverage[f] ?? null, 0)}</td></tr>`).join('');
  return `<section class="sec">${secH('Data quality', 'checked before any analysis')}
  <div class="card" style="display:grid;gap:12px">
   <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="mono" style="font-size:26px;font-weight:500">${d.score}%</div><span class="pill ${c}">${d.label}</span><span class="note">Completeness ${pct(d.completeness, 0)} · Validity ${pct(d.validity, 0)} · Structure ${pct(d.structure, 0)} · ${r.strikes.length} strikes · ${d.windowStrikes} in the ±${r.cfg.nearSteps}-strike core window${r.parity ? ` · put-call parity slope ${f2(r.parity.slope, 3)} (R² ${f2(r.parity.r2, 4)})` : ''}</span></div>
   ${d.issues.length ? `<ul class="plain">${d.issues.map(i => `<li>${esc(i.msg)}</li>`).join('')}</ul>` : '<div class="note">No data issues detected.</div>'}
   ${d.notes && d.notes.length ? `<div class="note">${d.notes.map(esc).join(' · ')}</div>` : ''}
   <details><summary>Available, missing and non-calculable metrics · column mapping</summary><div>
    <div class="grid g2"><div><div class="lbl">Available</div><div class="note" style="color:var(--ink2)">${d.available.map(f => esc(L[f] || f)).join(', ') || 'none'}</div></div>
    <div><div class="lbl">Missing from this file</div><div class="note" style="color:var(--ink2)">${d.missing.map(f => esc(L[f] || f)).join(', ') || 'none'}</div></div></div>
    <div><div class="lbl">Could not be calculated</div><ul class="plain">${d.uncalculable.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="grid g2"><div class="tw"><table><thead><tr><th>Call field</th><th class="l">Source column</th><th>Coverage</th></tr></thead><tbody>${mapRow('CE')}</tbody></table></div>
    <div class="tw"><table><thead><tr><th>Put field</th><th class="l">Source column</th><th>Coverage</th></tr></thead><tbody>${mapRow('PE')}</tbody></table></div></div></div></details>
  </div></section>`;
}
function rSnapshot(r) {
  const c = (l, v, s) => `<div><div class="lbl">${l}</div><div class="v">${v}</div><div class="s">${s || '&nbsp;'}</div></div>`;
  const mp = r.maxPain.strike, dist = mp != null ? mp - r.spot : null;
  return `<section class="sec">${secH('Market snapshot', esc(r.filename || ''))}
  ${r.asOfAssumed ? `<div class="callout info">${esc(r.asOfAssumed)}</div>` : ''}
  <div class="snap">
   ${c('Underlying', esc(r.underlying), r.lotSize ? 'Lot size ' + r.lotSize : 'Lot size not detected')}
   ${c('Spot', nIN(r.spot), r.spotActual ? esc(r.spotSource) : '<span class="wn">Estimated · synthetic spot</span>')}
   ${c('Expiry', r.expiry ? dday(r.expiry) : 'Unknown', r.expiry ? '15:30 IST' : 'not found in file')}
   ${c('Days to expiry', r.dte != null ? r.dte : '–', r.tctx.known ? f2(r.tctx.hours, 1) + ' hours left' : '')}
   ${c('ATM strike', nIN(r.atm), 'Step ' + r.step)}
   ${c('Max pain', nIN(mp), dist != null ? sg(Math.round(dist)) + ' pts from spot · context only' : '')}
   ${c('PCR (OI)', f2(r.pcr.oiAll, 2), 'Near-ATM ' + f2(r.pcr.oiNear, 2) + ' · Volume ' + f2(r.pcr.volAll, 2))}
   ${c('Expected move', '±' + nIN(r.expectedMove), pct(r.expectedMove / r.spot, 2) + ' · 1σ to expiry' + (r.straddle ? ' · straddle ' + f2(r.straddle, 0) : ''))}
   ${c('Market regime', regPill(r.regime), '')}
   ${c('Overall bias', biasPill(r.regime.bias), 'Direction score ' + f2(r.direction.D, 2))}
   ${c('ATM IV', r.iv.atmIv != null ? f2(r.iv.atmIv * 100, 1) + '%' : '–', 'Skew (put−call, ±3) ' + (r.iv.skew != null ? sg(+f2(r.iv.skew, 1)) + ' pts' : 'n/a'))}
   ${c('Data quality', r.dataQuality.score + '%', r.dataQuality.label)}
  </div></section>`;
}

function planBlock(c) {
  const p = c.plan, L = c.leg;
  const kv = (k, v, cl) => `<div><div class="k">${k}</div><div class="v ${cl || ''}">${v}</div></div>`;
  return `<div class="kv">
   ${kv('Strike', `${nIN(c.K)} ${c.side}<br><small style="color:var(--navy-mute)">${c.label} · Δ ${L.delta != null ? f2(L.delta, 2) : 'n/a'}</small>`)}
   ${kv('Entry', `${inr(p.entry.preferredLow)} – ${inr(p.entry.preferredHigh)}<br><small style="color:var(--navy-mute)">aggressive ${inr(p.entry.aggressive)} · avoid above ${inr(p.avoidAbove)}</small>`)}
   ${kv('Stop loss', `${inr(p.sl.premium)}<br><small style="color:var(--navy-mute)">underlying ${p.dir > 0 ? '<' : '>'} ${nIN(Math.round(p.sl.underlying))}</small>`, 'r')}
   ${kv('Risk / reward', `1 : ${f2(p.rr.main, 2)}<br><small style="color:var(--navy-mute)">to ${p.rr.mainIs}${p.rr.atAsk != null ? ' · at ask 1 : ' + f2(p.rr.atAsk, 2) : ''}</small>`)}
   ${[0, 1, 2].map(i => { const t = p.targets[i]; return kv('Target ' + (i + 1), t ? `${inr(t.premium)}<br><small style="color:var(--navy-mute)">underlying ${nIN(Math.round(t.underlying))} · 1:${f2(t.rr, 1)}</small>` : '<span style="color:var(--navy-mute)">not supported</span>', t ? 'g' : ''); }).join('')}
   ${kv('Max planned loss', p.riskPerLot ? inr(p.riskPerLot * (p.lots || 1)) + `<br><small style="color:var(--navy-mute)">${p.lots || 1} lot(s) × ${p.lotSize}${p.lotsByRisk != null ? ' · risk-sized: ' + p.lotsByRisk + ' lot(s)' : ''}</small>` : 'n/a')}
  </div>
  <div><h3>Trade invalidation</h3><div style="font-size:13.5px;color:#dfe5f2">${esc(p.invalidation)}</div></div>`;
}
function rDecision(r) {
  const d = r.decision, c = d.chosen, ref = d.reference, T = r.cfg.thresholds;
  const word = d.kind === 'NO TRADE' ? 'NO TRADE' : d.action, wc = d.kind === 'NO TRADE' ? 'no' : (c.side === 'CE' ? 'call' : 'put');
  const bc = d.kind === 'NO TRADE' ? 'nt' : d.kind === 'WATCH' ? 'wa' : 'go';
  const sc = d.score, scl = sc != null ? OCI.signals.classifyScore(sc, r.cfg) : null;
  let right = '';
  if (c) {
    right = planBlock(c) + `<div><h3>Why this trade</h3><ol class="why">${d.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>` +
      (d.kind === 'WATCH' ? `<div><h3>Not yet a buy</h3><ul class="why">${c.softFails.map(g => `<li>${esc(g.msg)}</li>`).join('')}${c.score < T.trade ? `<li>Signal Quality ${c.score} is below the ${T.trade} needed for a trade</li>` : ''}</ul></div>` : '');
  } else {
    right = `<div><div class="stay">${esc(d.staying || '')}</div></div>
     <div><h3>Why there is no trade</h3><ul class="why">${d.noTradeReasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
     <div><h3>What would change the decision</h3><ul class="why">${d.triggers.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  }
  return `<section class="sec"><div class="slab"><div class="ban ${bc}"><span>${esc(d.banner)}</span><span>${esc(r.underlying)} · ${dday(r.expiry)} expiry</span></div>
   <div class="slab-body"><div class="slab-l"><div class="lbl" style="color:var(--navy-mute)">Decision</div><div class="act ${wc}">${esc(word)}</div>
    <div><div class="lbl" style="color:var(--navy-mute)">Signal Quality Score</div><div class="score"><b>${sc != null ? sc : '–'}</b><span>/ 100${scl ? ' — ' + (d.kind === 'NO TRADE' ? 'highest-ranked setup is ' + scl.toLowerCase() : d.classification.toLowerCase().replace(/^./, m => m.toUpperCase())) : ''}</span></div><div class="meter"><i style="width:${sc || 0}%"></i></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${regPill(r.regime)} ${biasPill(r.regime.bias)}</div>
    <small>The score ranks setup quality from the evidence in this file. It is not a probability of profit; predictive accuracy needs historical backtesting. Bands: ${T.strong}+ strong, ${T.trade}+ trade, ${T.watch}+ watch, ${T.weak}+ weak.</small></div>
    <div class="slab-r">${right}</div></div></div></section>`;
}
function rAlt(r) {
  const d = r.decision; let a = d.alternative, title, note;
  if (a) { title = 'Alternative — Lower Conviction'; note = ''; }
  else if (d.kind === 'NO TRADE') {
    const pool = [...r.candidates.CE, ...r.candidates.PE].sort((x, y) => y.score - x.score); a = pool[0];
    if (!a) return ''; title = 'Highest-ranked setup (reference only, not a recommendation)'; note = a.hardFails.length ? 'Fails: ' + a.hardFails.map(g => esc(g.msg)).join('; ') : '';
  } else return '';
  const p = a.plan;
  return `<section class="sec">${secH(title)}<div class="card" style="display:grid;gap:8px">
   <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b class="mono" style="font-size:16px">${nIN(a.K)} ${a.side}</b><span class="pill ${a.side === 'CE' ? 'bull' : 'bear'}">${a.side === 'CE' ? 'CALL' : 'PUT'} · ${a.label}</span>${sigPill(a.signal)}<span class="mono">Score ${a.score}/100</span></div>
   ${p && p.ok ? `<div class="grid g4" style="font-size:13px"><div><div class="lbl">Entry</div><span class="mono">${inr(p.entry.preferredLow)} – ${inr(p.entry.preferredHigh)}</span></div><div><div class="lbl">Stop loss</div><span class="mono dn">${inr(p.sl.premium)}</span></div><div><div class="lbl">Targets</div><span class="mono">${p.targets.map(t => inr(t.premium)).join(' · ')}</span></div><div><div class="lbl">R:R</div><span class="mono">1 : ${f2(p.rr.main, 2)}</span></div></div>` : `<div class="note">${esc(p ? p.reason : '')}</div>`}
   ${note ? `<div class="note">${note}</div>` : ''}</div></section>`;
}

function rStructure(r) {
  const win = r.strikes.filter(s => Math.abs(s.strike - r.atm) <= 18 * r.step), K = win.map(s => s.strike);
  const sup = r.sr.support, res = r.sr.resistance;
  const bands = [...sup.slice(0, 2).map(z => ({ lo: z.low, hi: z.high, color: 'var(--bull)' })), ...res.slice(0, 2).map(z => ({ lo: z.low, hi: z.high, color: 'var(--bear)' }))];
  const mk = [{ K: r.spot, label: 'Spot', color: 'var(--ink)', dash: '2 0' }, { K: r.maxPain.strike, label: 'Max pain', color: 'var(--gold)', row: 1 }, { K: r.atm, label: 'ATM', color: 'var(--muted)', row: 2 }].filter(m => m.K != null);
  const zr = (z, nm, cl) => `<div class="zone"><div class="st" style="color:var(--${cl})">${z.low === z.high ? nIN(z.peak) : nIN(z.low) + '–' + nIN(z.high)}</div><div><div class="d">${nm} · ${z.grade} · ${sg(Math.round(z.dist))} pts · ${z.flow ? esc(z.flow.label) : 'flow n/a'}</div><div class="m">OI ${compact(z.oi)} (${sg(z.chgOi)}) · volume ${compact(z.volume)} · premium ${z.chg != null ? (z.chg > 0 ? '+' : '') + z.chg : 'n/a'}</div></div><div><div class="sbar"><i style="width:${z.strength}%;background:var(--${cl})"></i></div><div class="m" style="text-align:right">${z.strength}/100</div></div></div>`;
  const zoneHtml = (zs, nm, cl) => zs.length ? zs.slice(0, 2).map((z, i) => zr(z, nm + ' ' + (i + 1), cl)).join('') : `<div class="note">No ${nm.toLowerCase()} zone found.</div>`;
  return `<section class="sec">${secH('Market structure', 'zones combine OI, fresh OI, premium behaviour, volume, prominence and distance')}
  <div class="card"><div class="chart"><h4>Strike map</h4><div class="cap">Call OI above the axis, put OI below. Green band = support zone, red band = resistance zone.</div>${chartMap(win, K, bands, mk, r)}</div></div>
  <div class="grid g2"><div class="zones"><div class="lbl">Support</div>${zoneHtml(sup, 'Support zone', 'bull')}</div><div class="zones"><div class="lbl">Resistance</div>${zoneHtml(res, 'Resistance zone', 'bear')}</div></div>
  <div class="note">Max pain ${nIN(r.maxPain.strike)} is context only and is never used on its own. ${r.sr.crossedRes ? 'Spot has moved through the call wall at ' + nIN(r.sr.crossedRes.peak) + '. ' : ''}${r.sr.crossedSup ? 'Spot has moved through the put wall at ' + nIN(r.sr.crossedSup.peak) + '.' : ''}</div></section>`;
}
function chartMap(win, K, bands, mk, r) {
  const ce = win.map(s => s.CE.oi), pe = win.map(s => s.PE.oi == null ? null : -s.PE.oi);
  return chart({ strikes: K, step: r.step, kind: 'bar', h: 260, bands, markers: mk, fmt: v => compact(Math.abs(v)), series: [{ name: 'Call OI', color: 'var(--ce)', vals: ce }, { name: 'Put OI', color: 'var(--pe)', vals: pe }] }).replace(/<h4>.*?<\/h4>(<div class="cap">.*?<\/div>)?/, '');
}

function candRows(list, side, best) {
  return list.map(c => {
    const L = c.leg, sel = S.sel === side + c.K, why = c.hardFails[0];
    return `<tr class="clk ${sel ? 'sel' : ''}" data-k="${side}${c.K}"><td class="l"><b class="mono">${nIN(c.K)}</b><span class="sub">${c.label}${best && best.K === c.K ? ' · top' : ''}</span></td>
     <td class="n">${f2(L.px, 2)}<span class="sub">${L.pxSource || ''}</span></td><td class="n">${compact(L.oi)}</td><td class="n ${cls(L.chgOi)}">${sg(L.chgOi)}</td><td class="n">${compact(L.volume)}</td>
     <td class="n">${L.ivUsed != null ? f2(L.ivUsed * 100, 1) : '–'}</td><td class="n">${L.delta != null ? f2(L.delta, 2) : '–'}</td>
     <td class="n">${L.spreadPct != null ? f2(L.spreadPct, 2) + '%' : '–'}</td><td class="n"><b>${c.score}</b></td><td class="l">${sigPill(why ? 'NO TRADE' : c.signal)}${why ? `<span class="sub" style="white-space:normal;max-width:210px">${esc(why.msg)}</span>` : (c.softFails[0] ? `<span class="sub" style="white-space:normal;max-width:210px">${esc(c.softFails[0].msg)}</span>` : '')}</td></tr>`;
  }).join('');
}
function rRank(r) {
  const head = `<thead><tr><th>Strike</th><th>Price</th><th>OI</th><th>ΔOI</th><th>Volume</th><th>IV %</th><th>Delta</th><th>Spread</th><th>Score</th><th class="l">Signal</th></tr></thead>`;
  return `<section class="sec">${secH('Call and put rankings', 'ATM ±2 strikes · click a row for the score breakdown')}
  <div class="grid g2" style="grid-template-columns:minmax(0,1fr)"><div><div class="lbl" style="margin-bottom:5px">Call ranking</div><div class="tw"><table>${head}<tbody>${candRows(r.candidates.CE, 'CE', r.candidates.CE[0])}</tbody></table></div></div>
  <div><div class="lbl" style="margin-bottom:5px">Put ranking</div><div class="tw"><table>${head}<tbody>${candRows(r.candidates.PE, 'PE', r.candidates.PE[0])}</tbody></table></div></div></div>

  ${c ? plan(c) + '<h3>Why this trade</h3><ol>' + d.reasons.map(x => `<li>${esc(x)}</li>`).join('') + '</ol>' : '<ul>' + d.noTradeReasons.map(x => `<li>${esc(x)}</li>`).join('') + '</ul><p><b>' + esc(d.staying || '') + '</b></p><ul>' + d.triggers.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' + (ref ? '<h3>Highest-ranked setup (reference only)</h3>' + plan(ref) : '')}
  ${alt ? '<h2>Alternative — Lower Conviction</h2>' + plan(alt) : ''}
  <h2>Market snapshot</h2><table><tr><th>Spot</th>${T(nIN(r.spot) + ' (' + esc(r.spotSource) + ')')}<th>ATM</th>${T(nIN(r.atm))}</tr><tr><th>Max pain</th>${T(nIN(r.maxPain.strike))}<th>PCR (OI / near-ATM / volume)</th>${T(f2(r.pcr.oiAll) + ' / ' + f2(r.pcr.oiNear) + ' / ' + f2(r.pcr.volAll))}</tr><tr><th>Expected move</th>${T('±' + nIN(r.expectedMove) + ' (' + esc(r.emSource) + ')')}<th>DTE</th>${T(r.dte + ' (' + f2(r.tctx.hours, 1) + 'h)')}</tr><tr><th>Regime</th>${T(esc(r.regime.regime))}<th>Bias</th>${T(esc(r.regime.bias) + ' (' + f2(r.direction.D, 2) + ')')}</tr></table>
  <h2>Support and resistance</h2><table><tr><th>Side</th><th>Zone</th><th>Strength</th><th>OI</th><th>ΔOI</th><th>Flow</th></tr>${r.sr.support.slice(0, 2).map(zrow).join('')}${r.sr.resistance.slice(0, 2).map(zrow).join('')}</table>
  <h2>OI analysis</h2><p>${esc(r.volume.label)}. OI flow score ${f2(r.flow.x, 2)}, volume-weighted ${f2(r.flow.volFlow, 2)}. ${r.pcr.interpretation.map(esc).join('. ')}.</p><table><tr><th>Strike</th><th>Type</th><th>ΔOI</th><th>Premium Δ</th><th>Volume</th></tr>${r.flow.rows.slice(0, 8).map(x => `<tr><td>${nIN(x.K)} ${x.side}</td><td>${esc(x.flow.label)}</td><td>${sg(x.chgOi)}</td><td>${x.chg}</td><td>${nIN(x.volume)}</td></tr>`).join('')}</table>
  <h2>IV analysis</h2><p>ATM IV ${r.iv.atmIv != null ? f2(r.iv.atmIv * 100, 1) + '%' : 'n/a'}; skew ${r.iv.skew != null ? f2(r.iv.skew, 1) + ' vol pts' : 'n/a'}; relatively expensive: ${r.iv.rich.map(x => nIN(x.K) + x.side).slice(0, 8).join(', ') || 'none'}.</p>
  <h2>Greeks (candidates)</h2><table><tr><th>Strike</th><th>Delta</th><th>Gamma</th><th>Theta/day</th><th>Vega</th><th>Source</th></tr>${[...r.candidates.CE.slice(0, 3), ...r.candidates.PE.slice(0, 3)].map(x => `<tr><td>${nIN(x.K)} ${x.side}</td><td>${f2(x.leg.delta, 3)}</td><td>${x.leg.gamma != null ? x.leg.gamma.toFixed(5) : '–'}</td><td>${f2(x.leg.theta, 2)}</td><td>${f2(x.leg.vega, 2)}</td><td>${x.leg.greekSource || 'n/a'}</td></tr>`).join('')}</table>
  <h2>Candidate ranking</h2><table><tr><th>Strike</th><th>Score</th><th>Signal</th><th>Price</th><th>Spread</th><th>Status</th></tr>${[...r.candidates.CE, ...r.candidates.PE].sort((a, b) => b.score - a.score).map(x => `<tr><td>${nIN(x.K)} ${x.side}</td><td>${x.score}</td><td>${x.hardFails.length ? 'NO TRADE' : x.signal}</td><td>${f2(x.leg.px)}</td><td>${x.leg.spreadPct != null ? f2(x.leg.spreadPct, 2) + '%' : '–'}</td><td>${x.hardFails.length ? esc(x.hardFails[0].msg) : x.softFails.length ? esc(x.softFails[0].msg) : 'passes all gates'}</td></tr>`).join('')}</table>
  <h2>Data quality</h2><p>${r.dataQuality.score}% (${r.dataQuality.label}). ${r.dataQuality.issues.map(i => esc(i.msg)).join('; ')}</p><p class="n">Not calculable: ${r.dataQuality.uncalculable.map(esc).join('; ')}</p>
  <h2>Risk warnings</h2><ul><li>The Signal Quality Score is not a probability; it is untested until backtested on historical chains.</li><li>${r.dte != null && r.dte <= 1 ? 'Expiry is within a day: gamma and theta are extreme and premiums can go to zero quickly.' : 'Time decay and IV changes can erase a premium even when direction is right.'}</li><li>${r.spotActual ? 'Spot was read from the file.' : 'Spot is an estimate derived from put-call parity; Greeks are labelled Estimated.'}</li><li>Decision support only, not investment advice.</li></ul></body></html>`;
}
async function downloadReport() {
  if (!S.res) return;
  const html = buildReport(S.res), name = `trade-report-${S.res.underlying}-${dday(S.res.expiry)}.html`;
  try { const dl = await claude.use('downloads'); if (!dl) throw new Error('unavailable'); await dl.save({ filename: name, data: html }); toast('Report ready'); }
  catch (e) { if (e && e.code === 'declined') return; const w = document.createElement('textarea'); w.value = html; try { await navigator.clipboard.writeText(html); toast('Saving is unavailable here; report HTML copied to clipboard'); } catch (x) { toast('Saving is unavailable in this view'); } }
}

/* ---------- wiring ---------- */
$('btnUpload').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; };
$('btnAnalyze').onclick = runAnalysis;
$('btnSample').onclick = () => { loadSample(); runAnalysis(); };
$('btnSettings').onclick = () => { const s = $('settings'); if (s.hidden) buildSettings(); s.hidden = !s.hidden; };
$('btnReport').onclick = downloadReport;
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f).then(() => { if (!$('btnAnalyze').disabled) runAnalysis(); }); });
loadSample(); runAnalysis();
})();
</script>
